[project]
name = "wireless"
version = "0.1.0"
description = "WireGuard gateway for proxy protocols (VLESS, VMess, Trojan, Hysteria2)"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "requests>=2.28",
    "qrcode[pil]>=7.4",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
]
dev = [
    "pytest>=7",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
]

[project.scripts]
wireless = "wireless.cli:main"

[tool.setuptools.packages.find]
include = ["wireless*"]

[tool.setuptools.package-data]
"wireless.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
