[project]
name = "wireless"
version = "0.1.0"
description = "WireGuard gateway for proxy protocols (VLESS, VMess, Trojan, Hysteria2)"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "requests>=2.28",
    "qrcode[pil]>=7.4",
]

[project.scripts]
wireless = "wireless.cli:main"

[tool.setuptools.packages.find]
include = ["wireless*"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
