{% extends "base.html" %}
{% block title %}WireLess — конфиги{% endblock %}
{% block body %}
{% include "_topbar.html" %}

<main class="content">
  <section class="panel">
    <h2>Добавить конфиг</h2>
    <form id="add-form" class="form">
      <label for="url">Ссылка (vless://, vmess://, trojan://, hysteria2://)</label>
      <textarea id="url" rows="2" spellcheck="false" required></textarea>
      <label for="name">Имя (необязательно, иначе берётся из #fragment)</label>
      <input id="name" type="text" autocomplete="off">
      <div class="actions">
        <button type="button" id="preview" class="ghost">Проверить</button>
        <button type="submit">Добавить</button>
      </div>
      <p id="form-error" class="error" hidden></p>
    </form>
    <p id="preview-box" class="preview mono" hidden></p>
  </section>

  <section class="panel">
    <h2>Сохранённые конфиги</h2>
    <div class="table-wrap">
      <table class="table">
        <thead>
          <tr><th>Имя</th><th>Тип</th><th>Сервер</th><th></th></tr>
        </thead>
        <tbody id="proxies-body"></tbody>
      </table>
    </div>
    <p id="empty" class="muted" hidden>Пока нет конфигов — добавьте ссылку выше.</p>
    <p id="list-error" class="error" hidden></p>
  </section>
</main>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', path='proxies.js') }}"></script>
{% endblock %}
